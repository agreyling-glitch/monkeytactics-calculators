[package]
name = "blown-insulation-engine"
version = "0.1.0"
edition = "2024"
description = "Client-side blown-insulation coverage calculator for MonkeyTactics"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
