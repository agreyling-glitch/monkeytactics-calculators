[package]
name = "text-analyzer"
version = "0.1.0"
edition = "2024"
description = "Browser-based text analysis engine for MonkeyTactics"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
parallel = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "1", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
