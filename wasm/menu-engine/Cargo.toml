[package]
name = "monkeytactics-menu-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Domain-verified navigation engine for MonkeyTactics"
license = "MIT"

[lib]
name = "menu"
crate-type = ["cdylib"]

[dependencies]
gloo-net = { version = "0.6", features = ["json"] }
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Window",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
