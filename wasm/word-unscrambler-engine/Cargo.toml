[package]
name = "word-unscrambler-engine"
version = "0.1.0"
edition = "2024"
description = "Rust/WASM search engine for the MonkeyTactics Word Unscrambler"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
