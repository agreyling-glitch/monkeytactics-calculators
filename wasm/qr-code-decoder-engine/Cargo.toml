[package]
name = "monkeytactics-qr-decoder-engine"
version = "0.1.0"
edition = "2024"
description = "Local Rust/WASM QR decoding and preprocessing engine for MonkeyTactics"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rqrr = { version = "0.10.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
